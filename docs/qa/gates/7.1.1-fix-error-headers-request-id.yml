nfr_validation:
  security:
    status: PASS
    notes: |
      Header injection usa completionId gerado por crypto.randomUUID() (chatcmpl-<uuid>) — cryptographically-safe, não user-controlled. Zero surface de user input em nome ou valor de header. Sem eval, innerHTML, SQL string interpolation, hardcoded secrets, ou CORS changes. Nenhuma nova dep introduzida.

  performance:
    status: PASS
    notes: |
      Overhead: 1 spread + 1 string por error response. Sub-microsegundo. Nenhum impacto em happy path (código não muda). Sem alocação extra em SSE stream (openaiStreamErrorFrame só executa quando há erro mid-stream, e ainda não tem call sites).

  reliability:
    status: PASS
    notes: |
      Retrocompat mantida: completionId é opcional, chamadas antigas continuam válidas. Se qualquer call site novo esquecer de passar completionId, comportamento pre-fix é preservado (regressão silenciosa possível — mitigado por convenção de threading). Rollback trivial via git revert 8aad8e7 (additive-only).

  maintainability:
    status: PASS
    notes: |
      Comentários "Story 7.1.1" nos loci principais permitem rastreabilidade. Padrão de threading segue convenção existente (Story 1.1 FR-3 fez o mesmo para id/created em envelopeStream). Assinatura pública de openaiErrorResponse preservada — mudança contida em call sites internos.

